name: MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_ARTIFACT_ROOT: ./mlartifacts

  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ fromJSON(secrets.CLOUD_CREDENTIALS).aws_access_key_id }}
          aws-secret-access-key: ${{ fromJSON(secrets.CLOUD_CREDENTIALS).aws_secret_access_key }}
          aws-region: ${{ fromJSON(secrets.CLOUD_CREDENTIALS).region }}

      - name: Pull DVC data
        run: dvc pull

      - name: Train model
        run: python src/train.py
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow.db
          MLFLOW_ARTIFACT_ROOT: ./mlartifacts

      - uses: actions/upload-artifact@v4
        with:
          name: train-outputs
          path: |
            outputs/metrics.json
            models/model.pkl

  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: train-outputs
          path: .

      - name: Quality gate (accuracy >= 0.70)
        run: |
          python - <<'PY'
          import json, sys
          with open("outputs/metrics.json") as f:
              metrics = json.load(f)
          acc = float(metrics["accuracy"])
          print(f"accuracy={acc:.4f}  f1_score={float(metrics['f1_score']):.4f}")
          if acc < 0.70:
              print("Eval gate FAILED: accuracy below 0.70 — deploy will not run.")
              sys.exit(1)
          print("Eval gate PASSED.")
          PY

  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: train-outputs
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ fromJSON(secrets.CLOUD_CREDENTIALS).aws_access_key_id }}
          aws-secret-access-key: ${{ fromJSON(secrets.CLOUD_CREDENTIALS).aws_secret_access_key }}
          aws-region: ${{ fromJSON(secrets.CLOUD_CREDENTIALS).region }}

      - name: Upload model to S3
        run: |
          aws s3 cp models/model.pkl s3://${{ secrets.CLOUD_BUCKET }}/models/latest/model.pkl

      - name: Restart inference service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 8
            systemctl is-active mlops-serve

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "http://${{ secrets.VM_HOST }}:8000/health"; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
